<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SentinelLab · 人工盲评</title><script src="/auth.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#e8eef8;font:14px "Segoe UI","Microsoft YaHei",sans-serif;line-height:1.8}header{padding:20px 5%;display:flex;gap:20px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2a384e}a{color:#65dfbc}main{max-width:1200px;margin:auto;padding:30px 24px}h1{font-size:30px}.muted{color:#96a6be}.panel{background:#141e2c;border:1px solid #2a384e;border-radius:12px;padding:22px;margin:20px 0;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid>*{min-width:0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #2a384e;border-radius:6px;background:#0d1420;color:#e8eef8}input,select,textarea{width:100%}textarea{min-height:80px}button{cursor:pointer}button.primary{background:#65dfbc;color:#09291f}button:disabled{opacity:.4}label{display:block;margin:14px 0 7px;color:#96a6be}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px Consolas,monospace}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}#message{color:#ffc580}.answer{font-size:17px}.quote{border-left:3px solid #65dfbc;padding-left:12px;color:#96a6be}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px 16px}}
</style></head><body><header><strong>◈ SentinelLab / 人工盲评</strong><a href="/delivery.html">交付台</a><a href="/evidence.html">实测证据</a></header><main><h1>先看答案，再判断版本。</h1><p class="muted">左右顺序按题随机固定，不展示模型版本。依据资料判断正确性、引用和拒答；你的评审理由会保存，平台不会自动替人投票。</p><div id="message" role="status"></div>
<section class="panel"><div class="grid"><div><label>评审轮次</label><select id="round"></select></div><div><label>评审者姓名 / 标识</label><input id="reviewer" placeholder="请填写自己的名字"></div></div><div class="actions"><button id="load" class="primary">加载待评问题</button><span id="progress" class="muted"></span></div></section>
<section id="task" class="panel" hidden></section>
<section class="panel"><h2>怎样判断？</h2><p>答案要回答问题，引用要支持具体结论。资料没有给出的密码、客户数量、服务保证，应明确拒答。两份答案都不可信时，选择“两者都不好”。</p><p class="muted">reviewer 密钥只能读取本项目的盲评任务和提交投票，无法查询版本、Trace 或签署验收。已提交投票不可修改。同一密钥对每题只能投一次。</p></section>
</main><script>
const $=id=>document.getElementById(id);let taskSet=null,index=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api/public/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function guarded(fn){$('message').textContent='';try{await fn()}catch(e){$('message').textContent=e.message}}
function render(){const remaining=taskSet.tasks.filter(t=>!t.voted);$('progress').textContent=`已评 ${taskSet.tasks.length-remaining.length}/${taskSet.tasks.length}`;if(!remaining.length){$('task').hidden=false;$('task').innerHTML='<h2>本轮评审已提交完成</h2><p>感谢逐条判断。工程负责人可以查看汇总，与自动门禁一起决定是否签署技术验收。</p>';return}const task=remaining[0];$('task').hidden=false;const box=(side,answer)=>`<div class="panel"><h3>${side==='left'?'左侧答案':'右侧答案'}</h3><p class="answer">${esc(answer.answer)}</p><div class="quote">证据摘录：${esc(answer.quote||'无')}</div><p class="muted">引用：${esc((answer.citations||[]).join(', ')||'无')} · ${answer.abstain?'明确拒答':'提供回答'}</p></div>`;$('task').innerHTML=`<h2>${esc(task.input.question)}</h2><details open><summary>相关资料（用于核对）</summary>${task.reference_documents.map(d=>`<pre>[${esc(d.id)}]\n${esc(d.body)}</pre>`).join('')||'<p class="muted">检索未找到相关资料。</p>'}</details><div class="grid">${box('left',task.left)}${box('right',task.right)}</div><label>你的判断</label><select id="choice"><option value="left">左侧更好</option><option value="right">右侧更好</option><option value="tie">两者相当</option><option value="neither">两者都不好</option></select><label>理由（至少 5 个字符）</label><textarea id="rationale" placeholder="例如：引用原文明确写出默认值，另一答案没有依据"></textarea><div class="actions"><button class="primary" id="vote">提交此题，继续下一题</button></div>`;$('vote').onclick=()=>guarded(async()=>{if(!$('reviewer').value.trim())throw new Error('请填写评审者标识');$('vote').disabled=true;try{await api('reviews/'+taskSet.id+'/votes',{item_id:task.item_id,reviewer_name:$('reviewer').value,choice:$('choice').value,rationale:$('rationale').value});task.voted=true;render()}finally{if($('vote'))$('vote').disabled=false}})}
$('load').onclick=()=>guarded(async()=>{taskSet=await api('reviews/'+$('round').value+'/tasks');render()});
guarded(async()=>{const rounds=await api('reviews');$('round').replaceChildren(...rounds.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.id.slice(0,8)+' / '+r.samples+' 道题';return o}));if(!rounds.length)$('message').textContent='暂无评审轮次，请先在交付台创建对照评审。'});
</script></body></html>
