<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SentinelLab：从资料、运行、对比到人工评审的 Agent 交付工作台。">
  <title>SentinelLab · Agent 交付工作台</title>
  <link rel="stylesheet" href="/workspace.css">
  <script src="/workspace.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#setup" class="brand"><span class="brand-mark">S</span><span>SentinelLab<small>AGENT DELIVERY LAB</small></span></a>
    <p class="nav-caption">一次改动，一份交付证据</p>
    <nav aria-label="交付流程">
      <a href="#setup" data-view="setup"><span class="step-number">01</span><span>准备资料<small>选模板，确认题集</small></span><i></i></a>
      <a href="#run" data-view="run"><span class="step-number">02</span><span>运行版本<small>同一题集，独立执行</small></span><i></i></a>
      <a href="#compare" data-view="compare"><span class="step-number">03</span><span>检查差异<small>分数、退步与原始证据</small></span><i></i></a>
      <a href="#review" data-view="review"><span class="step-number">04</span><span>评审交付<small>盲评，签署技术验收</small></span><i></i></a>
    </nav>
    <div class="sidebar-foot"><a href="#guide" data-view="guide">这个项目解决什么问题？ ↗</a><p>v0.5 · 可复查的真实执行</p></div>
  </aside>
  <div class="workspace">
    <header><div><span class="eyebrow">交付工作台</span><p id="context-label">连接中…</p></div><div class="header-actions"><span id="model-label" class="badge">检查模型</span><button class="subtle" id="refresh">刷新数据</button><button class="subtle" id="connect">连接项目</button></div></header>
    <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="notice-dismiss" type="button" aria-label="关闭提示">×</button></div>
    <main id="app" aria-busy="true"><div class="empty">正在加载工作台…</div></main>
    <footer>公开文档与虚构演示数据 · 开发者自测单独记录 · 技术验收不代表真实客户上线</footer>
  </div>
  <dialog id="project-dialog"><form id="project-form"><div class="dialog-title"><h2>连接项目</h2><button type="button" data-close aria-label="关闭">×</button></div><p class="muted">粘贴项目密钥。密钥只保留在当前标签页；留空使用本地工作台。</p><label>项目访问密钥<input id="project-key" type="password" autocomplete="off" placeholder="留空使用本地项目"></label><button type="submit" class="primary">连接</button></form></dialog>
  <dialog id="detail-dialog"><div class="dialog-title"><h2 id="detail-title">执行记录</h2><button type="button" data-close aria-label="关闭">×</button></div><div id="detail-body"></div></dialog>
</body>
</html>
